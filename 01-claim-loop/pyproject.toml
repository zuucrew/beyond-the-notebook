[project]
name = "claim-loop"
version = "0.1.0"
description = "Human-in-the-loop claims processing. The queue is the project."
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary,pool]>=3.2",
    "typer>=0.12",
    "rich>=13",
]

[project.scripts]
claim-loop = "claim_loop.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/claim_loop"]
