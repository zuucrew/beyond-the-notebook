# Cloud SQL is the database. Two ways to reach it, both fine:
#
#   1. Authorised networks -- add your IP in the Console, then DATABASE_URL
#      points straight at the instance's public IP. No proxy, no CLI, no keys.
#
#   2. Cloud SQL Auth Proxy -- IP-independent and IAM-authenticated. Needs
#      `gcloud auth application-default login` once, then:
#        docker compose --profile proxy up -d cloudsql-proxy
#
#   docker compose run --rm app migrate-up
#   docker compose run --rm app submit
#   docker compose up app
#
# Offline, with a throwaway local Postgres on port 5433:
#   docker compose --profile local up -d db

services:
  # Only needed if you connect through the Cloud SQL Auth Proxy.
  #   docker compose --profile proxy up -d cloudsql-proxy
  #
  # Not needed at all if you added your IP to the instance's authorised
  # networks and DATABASE_URL points straight at its public IP.
  cloudsql-proxy:
    profiles: ["proxy"]
    image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:latest
    command:
      - "--address=0.0.0.0"
      - "--port=5432"
      - "${CLOUDSQL_INSTANCE:-}"
    volumes:
      # Your own gcloud credentials, created once by:
      #   gcloud auth application-default login
      #
      # NOT a service account key -- many organisations block those outright
      # (iam.disableServiceAccountKeyCreation), and rightly so.
      - ${GCP_CREDENTIALS_FILE:-${HOME}/.config/gcloud/application_default_credentials.json}:/creds.json:ro
    environment:
      GOOGLE_APPLICATION_CREDENTIALS: /creds.json
    ports:
      - "5432:5432"

  # Optional. Only starts with --profile local, for working offline or for
  # throwing the whole database away and starting again.
  db:
    profiles: ["local"]
    image: postgres:18
    environment:
      POSTGRES_USER: claim
      POSTGRES_PASSWORD: claim
      POSTGRES_DB: claimloop
    ports:
      - "5433:5432"
    volumes:
      - claim-loop-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U claim -d claimloop"]
      interval: 2s
      timeout: 3s
      retries: 15

  app:
    build: .
    # No depends_on: the app only needs DATABASE_URL to resolve, and how it
    # resolves -- proxy, public IP, or the local profile -- is your choice.
    environment:
      # Secrets and environment selection only. Every parameter -- thresholds,
      # model, pool size, dpi -- lives in config.yml.
      DATABASE_URL: ${DATABASE_URL}
      LLM_API_KEY: ${LLM_API_KEY:-}
      APP_ENV: ${APP_ENV:-}
    volumes:
      - ./dataset:/app/dataset:ro
    command: ["work"]

volumes:
  claim-loop-db:
