# Cloud SQL is the database. The proxy makes it reachable from here.
#
# The Cloud SQL Auth Proxy authenticates with your own gcloud credentials and
# opens a local port that tunnels to the instance. Nothing is exposed to the
# internet, no IP allowlisting, and DATABASE_URL is an ordinary Postgres URL --
# so the application cannot tell the difference between this and a local server.
#
#   docker compose up -d cloudsql-proxy
#   docker compose run --rm app migrate-up
#   docker compose run --rm app submit
#   docker compose up app
#
# Offline, with a throwaway local Postgres instead:
#
#   docker compose --profile local up -d db
#   DATABASE_URL=postgresql://claim:claim@db:5432/claimloop docker compose run --rm app status

services:
  cloudsql-proxy:
    image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:latest
    command:
      - "--address=0.0.0.0"
      - "--port=5432"
      - "${CLOUDSQL_INSTANCE}"
    volumes:
      # A service account key, read-only. Create it entirely in the Console:
      #   IAM & Admin -> Service Accounts -> Create -> role "Cloud SQL Client"
      #   -> Keys -> Add Key -> JSON, then save it here as gcp-key.json.
      #
      # If you would rather use your own gcloud login, set GCP_CREDENTIALS_FILE
      # to ~/.config/gcloud/application_default_credentials.json instead.
      - ${GCP_CREDENTIALS_FILE:-./gcp-key.json}:/creds.json:ro
    environment:
      GOOGLE_APPLICATION_CREDENTIALS: /creds.json
    ports:
      # So psql on the host can reach it too.
      - "5432:5432"
    healthcheck:
      test: ["CMD", "/cloud-sql-proxy", "--version"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Optional. Only starts with --profile local, for working offline or for
  # throwing the whole database away and starting again.
  db:
    profiles: ["local"]
    image: postgres:16
    environment:
      POSTGRES_USER: claim
      POSTGRES_PASSWORD: claim
      POSTGRES_DB: claimloop
    ports:
      - "5433:5432"
    volumes:
      - claim-loop-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U claim -d claimloop"]
      interval: 2s
      timeout: 3s
      retries: 15

  app:
    build: .
    depends_on:
      cloudsql-proxy:
        condition: service_started
    environment:
      # Secrets and environment selection only. Every parameter -- thresholds,
      # model, pool size, dpi -- lives in config.yml.
      DATABASE_URL: ${DATABASE_URL}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      APP_ENV: ${APP_ENV:-}
    volumes:
      - ./dataset:/app/dataset:ro
    command: ["work"]

volumes:
  claim-loop-db:
